name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, mutation testing and static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to Code Scanning
      actions: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run JUnit tests
        run: mvn -B test

      - name: Run PIT mutation testing
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: target/pit-reports
          if-no-files-found: ignore

      - name: Run SpotBugs
        if: always()
        run: mvn -B compile spotbugs:spotbugs

      - name: Upload SpotBugs SARIF to GitHub Code Scanning
        if: always() && hashFiles('target/spotbugsSarif.json') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs
